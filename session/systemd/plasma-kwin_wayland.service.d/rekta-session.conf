# KWin's values go here, not into the start script: startplasma hands its environment to every service and app of the
# session, and on logout restores only the user manager's, never the bus activation's.
[Service]
ExecStart=
ExecStart=@REKTA_LIBEXEC_DIR@/rekta-kwin @KWIN_WAYLAND_WRAPPER@ --xwayland
